[package]
name = "fxtwitter-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", features = ["client", "gateway", "model", "cache"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
# FxTwitter API から元ツイートの情報を取得するために使う。
# TLS は serenity と揃えて rustls にし、OpenSSL を持ち込まないようにする。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
# 定期投稿の期間計算（日本時間の週や月の境界）に使う。
# タイムゾーンは固定オフセットで足りるため、OSのタイムゾーン情報は読み込まない。
chrono = { version = "0.4", default-features = false, features = ["std"] }